name: Build and Test BPCalculator

# Triggers: on push to main + manual trigger
on:
  push:
    branches: [ main ]        # Only runs when code is pushed to main branch
  workflow_dispatch:           # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest     # Or 'windows-latest' if preferred

    steps:
      # 🧩 Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # Match your project’s .NET version

      # 📦 Step 3: Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 🏗️ Step 4: Build the project
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # 🧪 Step 5: Run unit tests (optional, if you have a test project)
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

      # 🚀 Step 6: Publish build artifacts
      - name: Publish build
        run: dotnet publish --configuration Release --output ./publish

      # 📦 Step 7: Upload build output as artifact
      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: BPCalculator-artifact
          path: ./publish
